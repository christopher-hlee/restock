<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171513" id="themeColor">
<!-- Stops Android WebView (Telegram's in-app browser) darkening the page by
     algorithm: both modes are designed, so neither may be re-coloured. -->
<meta name="color-scheme" content="light dark">
<script>
/* Before anything paints, so a light choice never flashes dark first. The
   choice is per device, a convenience, and the page is fine without it. */
try {
  if (localStorage.getItem('restock-theme') === 'light') {
    document.documentElement.dataset.theme = 'light';
    document.querySelector('#themeColor').content = '#F4EFE6';
  }
} catch (e) {}
</script>
<title>Restock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Kinari: ink on unbleached paper. The spec is design/kinari/README.md; the
   tokens below are design/kinari/kinari-tokens.css, pasted as it asks. */

/* sumi — dark (default) */
:root{
  --ground:#171513; --surface:#211E1B; --surface-quiet:#1C1A17;
  --rule:#3A342D; --border:#7A7063; --rule-faint:#2A2622;
  --bright:#F2EBDF; --text:#DDD5C8; --text-dim:#ADA497; --muted:#948B7E;
  --accent:#E2553B; --accent-ink:#170A06;
  --in-stock:#8FC27A; --failing:#E88AAE; --armed:#D9A441; --no-baseline:#7FB0D6;
  --photo-bg:#26221E; --photo-blend:normal; --photo-edge:#2A2622;
  --focus:#7FB0D6; --scrim:rgb(0 0 0 / .6);
  --tint-in-stock:#1C2219; --tint-failing:#251A1F;
  color-scheme:dark;
}

/* washi — light */
:root[data-theme="light"]{
  --ground:#F4EFE6; --surface:#EAE3D6; --surface-quiet:#EFE9DE;
  --rule:#D8CFBF; --border:#8C8173; --rule-faint:#E4DCCD;
  --bright:#1C1A17; --text:#2E2A25; --text-dim:#5E564C; --muted:#6F665A;
  --accent:#B8321E; --accent-ink:#FFFFFF;
  --in-stock:#3E6B2E; --failing:#9B2D5A; --armed:#8A5A00; --no-baseline:#1F5E86;
  --photo-bg:#E6DED0; --photo-blend:multiply; --photo-edge:transparent;
  --focus:#1F5E86; --scrim:rgb(28 26 23 / .45);
  --tint-in-stock:#E9EDDF; --tint-failing:#F3E3E8;
  color-scheme:light;
}

/* Mode-independent */
:root{
  --serif:"Newsreader","Iowan Old Style","Hiragino Mincho ProN","Yu Mincho","Noto Serif",Georgia,serif;
  --sans:"Hanken Grotesk",-apple-system,"Hiragino Sans","Yu Gothic",Roboto,"Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --gutter:16px; --bleed:16px;
  --held:var(--text-dim);
}
@media (min-width:600px){:root{--gutter:32px}}
@media (min-width:1200px){:root{--gutter:48px}}

/* ---------- base ----------
   Square, flat and still: radius 0, no depth, no transitions on controls.
   Hover only ever mirrors a pressed state, and only where hover exists, so a
   phone and a streamed isolation browser see the same page. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);font:400 15px/1.45 var(--sans);
  text-wrap:pretty;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
h1,h2{font-weight:400}
a{color:var(--bright);text-decoration-thickness:1px;text-underline-offset:3px}
@media (hover:hover){a:hover{color:var(--text)}}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums lining-nums}
.hide{display:none!important}
body.locked{overflow:hidden}

/* State glyphs and icons: 12px shapes that differ by outline alone, so no
   state ever depends on colour. */
.glyph,.icon{display:block;flex:none}
@keyframes tick{50%{opacity:0}}
.glyph.armed .tick{animation:tick 2.4s steps(1) infinite}
@media (prefers-reduced-motion:reduce){
  .glyph.armed .tick{animation:none}
  .glyph.armed path{fill:currentColor}
}
.state-eyebrow{display:inline-flex;align-items:center;gap:6px;font:500 13px/1.35 var(--sans)}
.when{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums lining-nums}
.states{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.star{color:var(--bright)}
.kicker{font-size:13px;line-height:1.35;color:var(--text-dim)}
.caption{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.35;color:var(--text-dim)}

/* ---------- buttons: buy, quiet, text ----------
   One fill means buy. --accent is only ever the background of a size chip,
   Add to cart, Cart and the Buyable figure — never a link, a tag, a selected
   control or a primary action that is not a purchase. */
.btn-buy{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:0;
  font:600 15px/1 var(--sans);font-variant-numeric:tabular-nums lining-nums;
  text-decoration:none;white-space:nowrap}
.btn-buy:active{filter:brightness(.88);transform:translateY(1px)}
.btn-buy:disabled{opacity:.45}
@media (hover:hover){.btn-buy:hover{filter:brightness(.88);color:var(--accent-ink)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn-buy{flex:none;min-width:56px;min-height:48px;padding:0 16px}
.btn-buy.addcart{min-height:48px;padding:0 20px}
.btn-quiet,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;background:transparent;border:1px solid var(--border);
  border-radius:0;color:var(--bright);font:500 15px/1 var(--sans);white-space:nowrap;
  text-decoration:none}
.btn-quiet:active,.btn-ghost:active{background:var(--surface)}
@media (hover:hover){.btn-quiet:hover,.btn-ghost:hover{background:var(--surface);color:var(--bright)}}
.btn-quiet:disabled,.btn-ghost:disabled{opacity:.45}
.btn-quiet.strong,.btn-ghost.strong{border-color:var(--bright);font-weight:600;min-height:48px}
/* .btn-accent carries no style any more. It survives on the dock's Add a
   watch only because ui-check opens the Add sheet on phones through
   `.dock .btn-accent`. */
.theme{width:44px;min-height:44px;padding:0!important;flex:none}
.theme svg{display:block}
.btn-text{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  padding:0 8px;margin-inline:-8px;background:none;border:0;color:var(--text);
  font:500 14px/1 var(--sans);text-decoration:underline;text-decoration-thickness:1px;
  text-underline-offset:3px;white-space:nowrap}
.btn-text:active{color:var(--bright)}
@media (hover:hover){.btn-text:hover{color:var(--bright)}}
.btn-text.danger{color:var(--failing)}
.x{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  flex:none;padding:0;background:none;border:0;color:var(--muted)}
.x:active{color:var(--bright)}
/* At a right edge the icon sits on the box's right side, lining up with the
   text edge, instead of the box being pulled past its row. */
.x.edge{justify-content:flex-end}
@media (hover:hover){.x:hover{color:var(--bright)}}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;font:600 12px/16px var(--sans);padding:2px 6px;
  border:1px solid currentColor;white-space:nowrap;margin-left:0;color:var(--muted)}
.tag.now{color:var(--bright)}
.tag.now.back{color:var(--in-stock)}
.tag.relisted{color:var(--muted);border-style:dotted}
.tag.soon{color:var(--no-baseline)}
.tag.unverified{color:var(--muted)}

/* ---------- photos ----------
   A square well. In light mode the product's white background melts into the
   paper (multiply); in dark mode a hairline edge keeps the well visible. */
.tn,.shot{position:relative;display:flex;align-items:center;justify-content:center;flex:none;
  aspect-ratio:1;background:var(--photo-bg);overflow:hidden;
  outline:1px solid var(--photo-edge);outline-offset:-1px}
.tn img,.shot img{display:block;width:100%;height:100%;object-fit:cover;
  mix-blend-mode:var(--photo-blend)}
.nophoto{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);
  font-size:12px;line-height:1;white-space:nowrap}
.shot{width:96px;height:96px}
.shot.sm{width:72px;height:72px}
.row.broken .shot img{filter:grayscale(1)}

/* ---------- header ---------- */
.hdr{max-width:calc(1120px + 2*var(--gutter));margin:0 auto;padding:24px var(--gutter) 0;
  display:flex;flex-direction:column;gap:10px}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:20px}
.hdr .eyebrow{font:500 12px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim)}
.hdr-row2{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 48px}
#headline{flex:1 1 300px;min-width:0;margin:0;font:400 28px/1.1 var(--serif);
  font-optical-sizing:auto;letter-spacing:-.01em;color:var(--bright);text-wrap:balance}
#headline.quiet{color:var(--text-dim)}
.hdr-actions{display:none;gap:8px}
/* Counts as figures in cells. Only a non-zero Buyable fills: it is the one
   number that means "go and buy something". */
.counts{flex:1 1 330px;min-width:0;display:flex}
.stat{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px;padding:10px 6px 9px}
.stat + .stat{border-left:1px solid var(--rule)}
.stat b{display:flex;align-items:center;gap:6px;font:500 24px/1 var(--sans);color:var(--bright);
  font-variant-numeric:tabular-nums lining-nums}
.stat span{font-size:13px;line-height:1.2;color:var(--text-dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stat.buy{background:var(--accent)}
.stat.buy b,.stat.buy span{color:var(--accent-ink)}
.stat.bad .glyph{color:var(--failing)}
.stat.zero b{color:var(--muted)}

/* ---------- page body and columns ---------- */
.body{max-width:calc(1120px + 2*var(--gutter));margin:0 auto;padding:0 var(--gutter) 48px}
#warnings .warn{margin-top:16px}
.cols{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:48px}
.col-main{flex:1 1 560px;min-width:0;max-width:720px}
.col-side{flex:1 1 300px;min-width:0;max-width:352px}
/* Sticky only while it fits: a taller side column pinned to the top would
   trap Recent alerts below the fold for good. */
.col-side.stick{position:sticky;top:0}
.one-col{max-width:720px}
#build{padding:40px 0 24px;font:12px/1 var(--mono);color:var(--muted)}

/* ---------- section header ---------- */
.group-label{display:flex;align-items:center;gap:8px;margin-top:32px;padding-top:12px;
  border-top:1px solid var(--rule);min-height:32px;color:var(--text-dim)}
.group-label h2{margin:0;font:500 19px/1.2 var(--serif);color:var(--bright)}
.group-label .n{font-size:15px;color:var(--text-dim);font-variant-numeric:tabular-nums lining-nums}
.group-label .btn-text{margin:-6px -8px -6px auto}
.list{margin-top:8px}
.list.waiting{margin-top:6px}

/* ---------- Just dropped / From your feeds ---------- */
.bucket{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;margin:0;
  padding:14px 0;background:none;border:0;border-top:1px solid var(--rule-faint);
  color:inherit;text-align:left;font:inherit}
.bucket.feedb{min-height:0}
.bucket:active{background:var(--surface-quiet)}
@media (hover:hover){.bucket:hover{background:var(--surface-quiet)}}
.bucket:focus-visible,.intent:focus-visible{outline-offset:-2px}
/* A fixed box even for one photo, so the names line up down the list. */
.deck{position:relative;flex:none;width:132px;height:56px}
.deck .tn{position:absolute;top:0;width:56px;height:56px;box-shadow:0 0 0 2px var(--ground)}
.deck .tn:nth-child(1){left:0;z-index:3}
.deck .tn:nth-child(2){left:36px;z-index:2}
.deck .tn:nth-child(3){left:72px;z-index:1}
.bk-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.bk-main .k{font-size:13px;line-height:1.3;color:var(--text-dim)}
.bk-name{font:500 17px/1.25 var(--serif);color:var(--bright);overflow-wrap:anywhere}
.bk-meta{font-size:13px;line-height:1.35;color:var(--text-dim);font-variant-numeric:tabular-nums lining-nums}
.bk-meta b{font-weight:400;color:var(--text)}
.bk-star{flex:none;display:inline-flex;align-items:center;gap:4px;color:var(--bright);
  font:600 13px/1 var(--sans);font-variant-numeric:tabular-nums lining-nums}

/* ---------- In stock, Held, Failing ---------- */
.row{display:flex;gap:14px;align-items:flex-start;padding:16px 0 4px}
.row > *{min-width:0}
.row-top{display:flex;gap:14px;align-items:flex-start}
.row-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.name{font:500 17px/1.25 var(--serif);color:var(--bright);overflow-wrap:anywhere}
.row.held .name{color:var(--text)}
.meta{font-size:13px;line-height:1.4;color:var(--text-dim);overflow-wrap:anywhere}
.meta b{color:var(--text);font-weight:500}
.price{font:500 15px var(--sans);color:var(--bright);font-variant-numeric:tabular-nums lining-nums;
  white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.row-text .actions{margin-top:8px}
/* In stock and Failing are blocks that bleed past the content edge, so on a
   phone they run edge to edge. */
.row.act{margin:12px calc(-1*var(--bleed)) 0;padding:16px var(--bleed) 12px;
  background:var(--tint-in-stock);flex-direction:column;align-items:stretch;gap:12px}
.row.act + .row.act{margin-top:8px}
.row-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:-6px}
.row-foot .actions{gap:8px 16px;flex-wrap:nowrap}
.row.broken{margin:12px calc(-1*var(--bleed)) 0;
  padding:16px var(--bleed) 12px calc(var(--bleed) - 2px);background:var(--tint-failing);
  border-left:2px solid var(--failing)}
.row.broken + .row.broken{margin-top:8px}
.row.broken .actions{gap:8px}
.row.broken .btn-quiet{padding:0 14px}
.err{font:13px/1.4 var(--mono);color:var(--failing);overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Waiting ----------
   The name owns the whole first line; the status wraps on the second. The
   status once shared a line with the name in an `auto` track, grew to
   "Watching · 739 tracked · 733 in the feed now", and left the name one
   character wide — broken a letter per line down the whole screen. The only
   thing beside the name now is Edit and ×, which cannot grow. */
.wait{display:grid;grid-template-columns:minmax(0,1fr) auto auto;
  grid-template-areas:"n n wa" "s t wa";column-gap:12px;align-items:center;padding:6px 0}
.wait:nth-child(5n+1):not(:first-child){border-top:1px solid var(--rule-faint);margin-top:6px;
  padding-top:12px}
.wait .n{grid-area:n;line-height:20px;overflow-wrap:anywhere;font-size:15px;color:var(--text)}
.wait .n .k{font-size:13px;color:var(--text-dim);margin-right:8px;white-space:nowrap}
.wait .n .sz{font-size:13px;color:var(--muted)}
.wait .s{grid-area:s;display:inline-flex;align-items:flex-start;gap:6px;font:500 13px/1.35 var(--sans);
  min-width:0}
.wait .s .glyph{margin-top:3px}
.wait .p{display:none}
.wait .t{grid-area:t;justify-self:end;align-self:start;font-size:13px;line-height:1.35;
  color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.wait .wa{grid-area:wa;display:flex;align-items:center;gap:8px;align-self:center}


/* ---------- Stores you might watch ---------- */
.sugg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;
  padding:14px 0;border-top:1px solid var(--rule-faint)}
.sugg .sn{font:500 17px/1.25 var(--serif);color:var(--bright);overflow-wrap:anywhere}
.sugg .sn .k{display:block;font:400 13px/1.3 var(--sans);color:var(--text-dim);margin-bottom:2px}
.sugg .sb{grid-column:1;font-size:13px;line-height:1.4;color:var(--text-dim)}
.sugg .sb b{color:var(--text);font-weight:500}
.sugg .sa{display:flex;gap:8px;grid-column:2;grid-row:1/span 2}
/* In the narrow side column the buttons go under the words, as on a phone:
   beside them they would leave a store's name about a hundred pixels. */
.col-side .sugg .sa{grid-column:1/-1;grid-row:auto;margin-top:8px}
.col-side .sugg .sa .btn-quiet{flex:1}

/* ---------- Recent alerts ---------- */
.feed{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px}
.feed .t{flex:none;width:54px;padding-top:12px;font-size:13px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums lining-nums}
.feed .fm{flex:1;min-width:0;padding-top:12px;overflow-wrap:anywhere;display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feed .fs{font-weight:500;color:var(--bright)}
.feed .fs.bad{color:var(--failing)}
.feed .fs .glyph{display:inline-block;vertical-align:-1px;margin-right:5px}
.feed .fw{color:var(--text-dim)}
.feed .fw a{color:inherit;text-decoration:none}


/* ---------- empty and notes ---------- */
.empty{font-size:15px;line-height:1.45;color:var(--text-dim);padding:24px 0;
  border-top:1px solid var(--rule)}
.empty .btn-quiet{margin-top:16px}
.warn{background:var(--surface-quiet);border-left:2px solid var(--armed);padding:12px 14px;
  margin:16px 0 0;font-size:13px;line-height:1.45;color:var(--text)}
.warn b{color:var(--bright);font-weight:600}
.warn .mono{font-size:13px}
.warn.note{background:none;border:0;padding:0;margin:0;color:var(--text-dim);line-height:1.4}
.warn.note b{color:var(--text);font-weight:500}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;z-index:200;width:max-content;max-width:480px;
  transform:translate(-50%,8px);opacity:0;background:var(--surface);border:1px solid var(--border);
  color:var(--bright);font-size:14px;line-height:1.4;padding:12px 16px;
  transition:opacity 160ms ease-out,transform 160ms ease-out}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--failing);color:var(--failing)}
.toast.good{border-color:var(--in-stock)}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:flex;overflow-y:auto}
#add{background-color:transparent;align-items:center;justify-content:center;padding:40px 20px}
#add.open{background-color:var(--scrim);transition:background-color 200ms linear}
.sheet{position:relative;width:100%;max-width:720px;background:var(--ground);border:1px solid var(--rule);
  padding:28px 32px 0}
#add .sheet{max-height:86vh;overflow-y:auto;overscroll-behavior:contain;opacity:0;
  transform:translateY(8px)}
#add .bucket-sheet{padding-top:0}
/* Enter is 200ms and starts synchronously (showSheet forces a reflow); close
   is instant, because the transition only exists in the open state. */
#add.open .sheet{opacity:1;transform:none;
  transition:opacity 200ms cubic-bezier(.2,.8,.2,1),transform 200ms cubic-bezier(.2,.8,.2,1)}
.sheet h2{margin:0;font:400 26px/1.1 var(--serif);letter-spacing:-.01em;color:var(--bright)}
.sheet .sub{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--text-dim);overflow-wrap:anywhere}
.sheet .sub b{font-weight:500;color:var(--bright)}
.sheet-actions{position:sticky;bottom:0;z-index:2;display:flex;align-items:center;flex-wrap:wrap;
  gap:8px 16px;margin:24px -32px 0;padding:16px 32px 20px;background:var(--ground);
  border-top:1px solid var(--rule)}
.sheet-actions .strong{flex:1}
.sheet-actions .err-line{font-size:13px;color:var(--failing)}
.sheet .group-label{margin-top:24px}

/* Drop sheet: the sheet itself scrolls, its heading and footer pinned. */
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;gap:12px;
  padding:28px 0 16px;background:var(--ground)}
.sheet-head .hd{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.sheet-head .eyebrow{font-size:13px;line-height:1.3;color:var(--text-dim)}
.sheet-head h2{overflow-wrap:anywhere}
.sheet-head .sub{margin:0;font-size:13px;line-height:1.35;color:var(--text);
  font-variant-numeric:tabular-nums lining-nums}
.sheet-head .x{color:var(--text);margin-top:-4px}
.bucket-sheet .sheet-actions > a.btn-ghost{flex:1}
.bucket-sheet .sheet-actions .btn-text{margin-right:-8px}
.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:16px 0;
  border-top:1px solid var(--rule-faint)}
.item-media{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.item-media > a{display:block}
.item .tn{width:96px;height:96px}
.item-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.item-head{display:flex;gap:6px;align-items:flex-start}
.item-head .star{margin-top:4px}
.item-title{font:500 17px/20px var(--serif);color:var(--bright);text-decoration:none;
  overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.pl{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
.landed{font-size:13px;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
.item-meta{font-size:13px;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums lining-nums}
.lag{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.lag.slow{color:var(--armed)}
.item-acts{display:flex;align-items:center;gap:8px;margin-top:8px}
.item-acts .btn-buy{min-width:64px;min-height:44px;padding:0 16px}
.item-acts .x{margin-left:auto}
.item-acts .caption{color:var(--muted)}

/* Add a watch */
#intents{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.intent{display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:center;width:100%;
  min-height:56px;padding:10px 14px;border:1px solid var(--border);background:transparent;
  text-align:left;color:inherit}
.intent .q{font:400 15px/1.35 var(--sans);color:var(--text)}
.intent .ex{display:none;font-size:13px;line-height:1.35;color:var(--muted)}
.intent[aria-pressed="true"]{background:var(--surface-quiet);border-color:var(--bright)}
.intent[aria-pressed="true"] .q{color:var(--bright);font-weight:500}
.field{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.field label{display:flex;justify-content:space-between;gap:12px;font:500 13px/1.3 var(--sans);
  color:var(--text-dim)}
.field label .hint{font-weight:400;color:var(--muted)}
.field input{width:100%;min-height:48px;padding:0 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:0;color:var(--bright);font:400 16px var(--sans)}
.field input[type="url"]{font-family:var(--mono)}
.field input::placeholder{color:var(--muted)}
.field input:focus{outline:2px solid var(--focus);outline-offset:2px}
.field .aside{font-size:13px;line-height:1.4;color:var(--muted)}
.detect{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;line-height:1.35;
  color:var(--text-dim)}
.detect .glyph{margin-top:3px;color:var(--in-stock)}
.detect b{font-weight:600;color:var(--bright)}
.detect .l2{font-size:13px;color:var(--text-dim);margin-top:2px}
.detect.bad{color:var(--failing)}
.detect.bad .glyph{color:var(--failing)}
.seg{display:flex;border:1px solid var(--border)}
.seg button{flex:1;min-height:48px;background:transparent;border:0;color:var(--text-dim);
  font:500 15px/1 var(--sans);font-variant-numeric:tabular-nums lining-nums}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--bright);
  color:var(--bright);font-weight:600}

/* Details */
.check{display:grid;grid-template-columns:72px 56px 48px minmax(0,1fr);gap:12px;padding:8px 0;
  border-top:1px solid var(--rule-faint);font-size:13px;font-variant-numeric:tabular-nums lining-nums}
.check .ct{color:var(--muted)}
.check .cr{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.check .cs,.check .ce{font-family:var(--mono);color:var(--text-dim)}
.check .ce{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Why didn't this alert? */
.fired{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;
  padding:12px 0;border-top:1px solid var(--rule-faint)}
.fired .fi{font:500 15px/1.35 var(--sans);color:var(--text);min-width:0}
.fired .fi .k{display:block;font:400 13px/1.35 var(--sans);color:var(--text-dim);margin-bottom:2px}
.fired .fi .k .tag{margin-left:8px}
.fired .v{display:inline-flex;align-items:center;gap:6px}
.fired .lines{font-size:13px;font-weight:400;line-height:1.5;color:var(--text);
  font-variant-numeric:tabular-nums lining-nums}
.fired .ft{font-size:13px;color:var(--muted)}

/* Sign in is the page itself, not a sheet over one. */
#login.overlay{background:var(--ground);align-items:center;justify-content:center;padding:24px var(--gutter)}
#login .sheet{max-width:420px;padding:32px}
#login .sheet-actions{position:static;margin:24px 0 0;padding:0;border-top:0;background:none}
#login .sheet-actions .strong{flex:none;min-width:120px}
#login .hint{margin-top:16px;font-size:13px;color:var(--muted)}

.dock{display:none}

/* ---------- desktop ---------- */
@media (min-width:821px){
  .hdr{padding-top:48px}
  #headline{font-size:40px}
  .counts{max-width:440px}
  .hdr-actions{display:flex}
  .intent{grid-template-columns:12px 1fr 240px}
  .intent .ex{display:block}
}

/* ---------- the phone ----------
   The same boundary as ever: a bottom dock, a stacked header, and sheets
   that rise from the bottom, scroll inside themselves and keep their main
   button in reach. */
@media (max-width:820px){
  .hdr,.body{padding-left:max(var(--gutter),env(safe-area-inset-left));
    padding-right:max(var(--gutter),env(safe-area-inset-right))}
  .body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .cols{display:block}
  .col-main,.col-side,.one-col{max-width:none}
  .col-side .sugg .sa{margin-top:0}

  .dock{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:12px max(var(--gutter),env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(var(--gutter),env(safe-area-inset-left));
    background:var(--ground);border-top:1px solid var(--rule)}
  .dock button{min-height:44px;padding:0 12px}
  .dock .btn-ghost:not(.theme){flex:1}

  .sugg .sa{grid-column:1/-1;grid-row:auto}
  .sugg .sa .btn-quiet{flex:1}

  .toast{bottom:calc(88px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:none}

  #add{align-items:flex-end;padding:0;overflow:hidden}
  .sheet{max-width:none;border:0;border-top:1px solid var(--rule);padding:0 var(--gutter)}
  #add .sheet{max-height:92vh;max-height:92dvh;opacity:1;transform:translateY(100%)}
  #add.open .sheet{transform:none;transition:transform 200ms cubic-bezier(.2,.8,.2,1)}
  #add .sheet::before{content:'';display:block;width:36px;height:4px;background:var(--border);
    border-radius:2px;margin:8px auto 6px}
  .sheet-actions{margin:24px calc(-1*var(--gutter)) 0;
    padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom))}
  /* The drop sheet's grab handle rides in its pinned head. */
  #add .bucket-sheet::before{display:none}
  .sheet-head{padding:20px 0 14px}
  .sheet-head::before{content:'';position:absolute;top:8px;left:50%;margin-left:-18px;width:36px;
    height:4px;background:var(--border);border-radius:2px}
  .fired .ft{grid-column:1/-1}
  .check{grid-template-columns:60px 52px 40px minmax(0,1fr);gap:8px}

  #login.overlay{align-items:flex-start}
  #login .sheet{padding:24px 18px;border:1px solid var(--rule)}
}

@media (prefers-reduced-motion:reduce){
  #add.open,#add.open .sheet,.toast{transition-duration:1ms!important}
}
</style>

<body>

<div id="login" class="overlay hide">
  <div class="sheet">
    <h2>Restock</h2>
    <p class="sub" id="loginNote">Enter your dashboard password.</p>
    <div class="field">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    </div>
    <div class="sheet-actions">
      <button class="btn-quiet strong" onclick="doLogin()">Sign in</button>
      <span id="loginErr" class="err-line"></span>
    </div>
    <p class="hint">Faster: send <span class="mono">/login</span> to Muz in Telegram.</p>
  </div>
</div>

<main id="app" class="hide">
  <header class="hdr">
    <div class="hdr-row1">
      <span class="eyebrow" id="eyebrow">Your list</span>
      <div class="hdr-actions">
        <button class="btn-ghost theme" onclick="toggleTheme()"></button>
        <button class="btn-ghost" onclick="openInspect()">Why no alert?</button>
        <button class="btn-ghost" onclick="openAdd()">Add a watch</button>
      </div>
    </div>
    <div class="hdr-row2">
      <h1 id="headline">—</h1>
      <div class="counts" id="counts"></div>
    </div>
  </header>
  <div class="body">
    <div id="warnings"></div>
    <div id="sheet" aria-live="polite"></div>
  </div>
  <!-- The phone's primary actions, where a thumb already is. On a wide
       screen they live in the header instead and this is not rendered. -->
  <nav class="dock" aria-label="Actions">
    <button class="btn-ghost theme" onclick="toggleTheme()"></button>
    <button class="btn-ghost" onclick="openInspect()">Why no alert?</button>
    <button class="btn-ghost btn-accent" onclick="openAdd()">Add a watch</button>
  </nav>
</main>

<div id="add" class="overlay hide" onclick="if(event.target===this)closeSheet()"></div>

<script>
const $ = id => document.getElementById(id);

/* ---------- light / dark ---------- */
const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/></svg>';
const isLight = () => document.documentElement.dataset.theme === 'light';
/* The icon shows where a tap takes you: a sun in the dark, a moon in the light. */
function paintThemeButtons() {
  const next = isLight() ? 'dark' : 'light';
  document.querySelectorAll('.theme').forEach(b => {
    b.innerHTML = isLight() ? MOON : SUN;
    b.setAttribute('aria-label', `Switch to ${next} mode`);
    b.title = `Switch to ${next} mode`;
  });
  $('themeColor').content = isLight() ? '#F4EFE6' : '#171513';
}
function toggleTheme() {
  if (isLight()) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = 'light';
  try { localStorage.setItem('restock-theme', isLight() ? 'light' : 'dark'); } catch (e) {}
  paintThemeButtons();
}
paintThemeButtons();
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let WATCHES = [], EVENTS = [], BUCKETS = [], SUGGESTED = [], TIMER = null, INTENT = 'restock';
let OPEN_BUCKET = null, OPEN_SIG = '';
let PENDING_FILTER = null;   // a suggested store's brand filter, until saved

/* Enters rising, holds four seconds, fades, then goes. role=status so a
   screen reader says it once without stealing focus. */
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  t.setAttribute('role', 'status');
  document.body.appendChild(t);
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 160); }, 4000);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {headers: {'Content-Type': 'application/json'}, ...opts});
  if (res.status === 401) { showLogin(); throw new Error('Not authenticated'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || ('HTTP ' + res.status));
  return body;
}

/* ---------- glyphs (design/kinari/glyphs.js) ----------
   Every state pairs a SHAPE with a WORD, so colour is never load-bearing. */
const svg = (body, size = 12, box = '0 0 12 12', cls = 'glyph') =>
  `<svg class="${cls}" viewBox="${box}" width="${size}" height="${size}" aria-hidden="true">${body}</svg>`;
const RING = '<circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>';

const GLYPH = {
  in_stock:     svg('<circle cx="6" cy="6" r="4.5" fill="currentColor"/>'),
  held:         svg(RING + '<path d="M6 1.5a4.5 4.5 0 0 0 0 9z" fill="currentColor"/>'),
  out_of_stock: svg(RING),
  not_yet:      svg(RING + '<path d="M6 6V3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'),
  watching:     svg(RING + '<circle cx="6" cy="6" r="1.6" fill="currentColor"/>'),
  unknown:      svg('<circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.1 1.43"/>'),
  failing:      svg('<path d="M6 1.3 10.9 10.4H1.1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 4.8v2.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'),
  paused:       svg('<path d="M2.5 2h2.5v8H2.5zM7 2h2.5v8H7z" fill="currentColor"/>'),
  armed:        svg('<path d="M6 1 11 6 6 11 1 6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle class="tick" cx="6" cy="6" r="1.6" fill="currentColor"/>', 12, '0 0 12 12', 'glyph armed'),
  backoff:      svg('<path d="M1.5 2h2v8h-2zM5 4h2v6H5zM8.5 6h2v4h-2z" fill="currentColor"/>'),
};

/* The 10-second redraw replaces rows. A negative delay keeps every Armed blink
   on one continuous clock instead of restarting it on each redraw. */
const armedGlyph = () => GLYPH.armed.replace('class="tick"',
  `class="tick" style="animation-delay:-${Date.now() % 2400}ms"`);

/* A product that has never been on sale is not sold out — the storefront
   says "Coming Soon" for one and "Notify Me When Available" for the other,
   and calling both sold out loses the distinction that matters most. */
const WORD = {in_stock: 'In stock', held: 'Held', out_of_stock: 'Sold out', not_yet: 'Not yet on sale',
  failing: 'Failing', unknown: 'No baseline', watching: 'Watching', paused: 'Paused',
  armed: 'Armed', backoff: 'Backing off'};

const INK = {in_stock: 'var(--in-stock)', held: 'var(--held)', out_of_stock: 'var(--muted)',
  not_yet: 'var(--muted)', failing: 'var(--failing)', unknown: 'var(--no-baseline)',
  watching: 'var(--text)', paused: 'var(--muted)', armed: 'var(--armed)', backoff: 'var(--armed)'};

const ICON = {
  star:    svg('<path d="M6 .9 7.5 4.1l3.5.4-2.6 2.4.7 3.5L6 8.7l-3.1 1.7.7-3.5L1 4.5l3.5-.4z" fill="currentColor"/>', 12, '0 0 12 12', 'icon'),
  x:       svg('<path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5"/>', 12, '0 0 12 12', 'icon'),
  disc:    svg('<circle cx="4" cy="4" r="3.5" fill="currentColor"/>', 8, '0 0 8 8', 'icon'),
  arrow:   '<svg class="icon" viewBox="0 0 14 10" width="14" height="10" aria-hidden="true"><path d="M1 5h11M8 1.2 11.8 5 8 8.8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  radio:   svg(RING, 12, '0 0 12 12', 'icon'),
  radioOn: svg(RING + '<circle cx="6" cy="6" r="2.2" fill="currentColor"/>', 12, '0 0 12 12', 'icon'),
  nophoto: svg('<path d="M6.4 4.6a1.6 1.6 0 1 1 2.1 1.5c-.3.1-.5.4-.5.7v.8l6.3 4.2H1.7L8 7.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>', 16, '0 0 16 16', 'icon'),
};

/* Derived state. `armed` stays orthogonal and is never folded in — a watch can
   be failing and armed at once, and both must render. */
function derive(w) {
  if ((w.consecutive_failures || 0) > 0) return 'failing';
  if (w.paused) return 'paused';
  return w.last_state || 'unknown';
}
const isArmed = w => w.hot_until && asDate(w.hot_until) > new Date();
/* A rate-limited watch is healthy and deliberately polling less. It keeps its
   state, so without this it would look completely normal and the reason for the
   slower cadence would be invisible. */
const isBackingOff = w => (w.consecutive_failures || 0) === 0
  && /rate limited/i.test(w.last_error || '');
/* Detection names a collection watch "host · handle" and separately sets
   brand=host, so rendering both prints the host twice. Show only the part the
   kicker does not already say. */
function shortName(w) {
  const name = w.last_title || w.name || '';
  const brand = (w.brand || '').trim();
  if (!brand || !name.toLowerCase().startsWith(brand.toLowerCase())) return name;
  return name.slice(brand.length).replace(/^\s*·\s*/, '') || name;
}
const realSizes = w => (w.available_sizes || []).filter(s => s && !/^default/i.test(s));

/* Two kinds of timestamp reach this page and they are NOT interchangeable.
   Ours are bare UTC out of SQLite ("2026-09-16 10:00:00") and need a Z; a
   store's carry their own offset ("2026-09-16T22:36:47-04:00"), and appending
   Z to one of those yields Invalid Date. Same distinction as parse vs
   parse_instant on the server, and the same four hours of silence if it is
   got wrong — so there is one function and it handles both. */
const asDate = ts => {
  if (!ts) return null;
  const s = String(ts).trim();
  const absolute = /([zZ]|[+-]\d{2}:?\d{2})$/.test(s);
  const d = new Date(absolute ? s : s.replace(' ', 'T') + 'Z');
  return isNaN(d.getTime()) ? null : d;
};

function ago(ts) {
  const at = asDate(ts);
  if (!at) return 'never';
  const s = (Date.now() - at) / 1000;
  if (s < 60) return Math.max(0, Math.round(s)) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
const every = w => {
  const n = (isArmed(w) ? w.hot_interval_s : w.base_interval_s) || 300;
  return n < 60 ? n + 's' : n < 3600 ? Math.round(n / 60) + 'm' : Math.round(n / 3600) + 'h';
};
const money = (v, cur) => v == null ? '—' :
  symbolFor(cur) + (Number(v) % 1 === 0 ? Number(v).toLocaleString() : Number(v).toFixed(2));

/* A yen store rendered with a dollar sign is wrong by a factor of about 142,
   in the flattering direction. */
const SYMBOLS = {USD: '$', JPY: '¥', EUR: '€', GBP: '£',
                 CAD: '$', AUD: '$'};
const symbolFor = cur => SYMBOLS[(cur || 'USD').toUpperCase()] || ((cur || '') + ' ');

/* A state is a glyph and a word; a time, when there is one, is quieter. */
const eyebrowFor = (state, extra, time) =>
  `<span class="state-eyebrow" style="color:${INK[state]}">` +
  `${state === 'armed' ? armedGlyph() : (GLYPH[state] || '')}` +
  `<span>${esc(WORD[state])}${extra ? ' · ' + esc(extra) : ''}` +
  `${time ? `<span class="when"> · ${esc(time)}</span>` : ''}</span></span>`;
const armedBadge = () => eyebrowFor('armed');
const backoffBadge = () =>
  `<span class="state-eyebrow" style="color:var(--armed)"` +
  ` title="The store asked for fewer requests. Polling has slowed; nothing is broken.">` +
  `${GLYPH.backoff}<span>Backing off</span></span>`;

/* ---------- photos ---------- */

/* Store photos at thumbnail size. Shopify's CDN resizes on request, so a
   64px square on a phone does not cost the 2000px original. Anything that
   is not plainly http(s) is refused rather than handed to an <img>. */
function thumbUrl(src, px) {
  if (!src || !/^https?:\/\//i.test(src)) return '';
  try {
    const u = new URL(src);
    if (u.hostname === 'cdn.shopify.com' || u.pathname.includes('/cdn/shop/'))
      u.searchParams.set('width', String(px));
    return u.href;
  } catch (err) { return ''; }
}
/* Links in the drop sheet come partly from third-party feeds. Only plain
   http(s) is allowed through to an href; anything else renders as no link. */
const safeHref = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

/* No photo says so, rather than leaving a blank that reads as broken. It is
   swapped in for a failed image, never layered under one: with multiply it
   would show through a white product background. */
const NOPHOTO = () => `<span class="nophoto">${ICON.nophoto}no photo</span>`;
function noPhoto(img) { img.outerHTML = NOPHOTO(); }
const photo = (src, px) => {
  const u = thumbUrl(src, px * 2);
  return u ? `<img src="${esc(u)}" alt="" loading="lazy" decoding="async"`
    + ` referrerpolicy="no-referrer" onerror="noPhoto(this)">` : NOPHOTO();
};
const thumb = (src, px) => `<span class="tn">${photo(src, px)}</span>`;
const shot = (w, cls) => `<span class="shot ${cls || ''}">${photo(w.last_image, cls === 'sm' ? 72 : 96)}</span>`;

/* ---------- rows ---------- */

function actRow(w) {
  const usable = (w.offers || []).filter(o => o.cart_url);
  /* Shopify names a product's only variant "Default Title". That is not a size,
     so a product with no named variants collapses to a single Add to cart —
     a chip reading "Default Title" would be nonsense. */
  const named = usable.filter(o => o.title && !/^default/i.test(o.title));
  const pref = named.filter(o => o.preferred);
  const rest = named.filter(o => !o.preferred);
  const sized = named.length > 0;

  let action, caption;
  if (sized && usable.length) {
    /* Sold-out sizes are absent, never disabled — a disabled button invites a
       tap that cannot work. */
    const chips = [...pref, ...rest].slice(0, 6).map((o, i) => {
      const lead = i === 0 && pref.length > 0;
      return `<button class="chip btn-buy"
        aria-label="Add size ${esc(o.title)}${lead ? ', your size,' : ''} to cart"
        onclick="window.open('${esc(o.cart_url)}','_blank','noopener')">${lead ? ICON.disc : ''}${esc(o.title)}${lead ? ICON.arrow + 'cart' : ''}</button>`;
    }).join('');
    action = `<div class="chips">${chips}</div>`;
    caption = pref.length
      ? `<span class="caption"><span class="star">${ICON.disc}</span>your size · each chip is that size's cart link</span>`
      : `<span class="caption">each chip is that size's cart link</span>`;
  } else {
    const cart = (usable[0] || {}).cart_url;
    action = cart
      ? `<div class="chips"><button class="chip btn-buy addcart"
          onclick="window.open('${esc(cart)}','_blank','noopener')">Add to cart</button></div>`
      : `<div class="chips"><button class="btn-quiet"
          onclick="window.open('${esc(w.url)}','_blank','noopener')">Open product</button></div>`;
    caption = `<span class="caption">${cart ? 'cart permalink · skips product page'
      : 'no cart link · opens the product page'}</span>`;
  }

  const watched = (w.size_pref || '').toUpperCase();
  const back = realSizes(w).join(', ');
  const bits = [`<span class="price">${money(w.last_price, w.currency)}</span>`];
  if (watched) bits.push('watching <b>' + esc(watched) + '</b>');
  if (back) bits.push(esc(back) + ' returned');
  bits.push('every ' + every(w) + (isArmed(w) ? ', armed' : ''));

  return `<div class="row act">
    <div class="row-top">
      ${shot(w)}
      <div class="row-text">
        <div class="states">
          ${eyebrowFor('in_stock', watched ? 'your size' : '', ago(w.last_checked_at))}
          ${isArmed(w) ? armedBadge() : ''}
          ${isBackingOff(w) ? backoffBadge() : ''}
        </div>
        ${w.brand ? `<span class="kicker">${esc(w.brand)}</span>` : ''}
        <span class="name">${esc(w.last_title || w.name)}</span>
        <span class="meta">${bits.join(' · ')}</span>
      </div>
    </div>
    ${action}
    <div class="row-foot">
      ${caption}
      <span class="actions">
        <button class="btn-text" onclick="edit(${w.id})">Edit</button>
        <button class="btn-text" onclick="detail(${w.id})">Details</button>
      </span>
    </div>
  </div>`;
}

/* Held is the app working. It must be visible and explained — never hidden,
   never styled as an error. */
function heldRow(w) {
  const back = realSizes(w).join(', ');
  const first = back ? back.split(',')[0].trim() : '';
  const watched = (w.size_pref || '').toUpperCase();
  return `<div class="row held">
    ${shot(w, 'sm')}
    <div class="row-text">
      ${eyebrowFor('held', 'not your size', ago(w.last_checked_at))}
      ${w.brand ? `<span class="kicker">${esc(w.brand)}</span>` : ''}
      <span class="name">${esc(w.last_title || w.name)}</span>
      <span class="meta"><span class="price">${money(w.last_price, w.currency)}</span> · in stock in
        <b>${esc(back || 'another size')}</b> only · you watch <b>${esc(watched)}</b>
        · nothing sent, and nothing wrong</span>
      <div class="actions">
        ${first ? `<button class="btn-quiet"
          onclick="alsoAlert(${w.id},'${esc(first)}')">Also alert on ${esc(first)}</button>` : ''}
        <button class="btn-text" onclick="edit(${w.id})">Edit</button>
        <button class="btn-text" onclick="detail(${w.id})">Details</button>
      </div>
    </div>
  </div>`;
}

/* Failing must never inherit the calm sold-out treatment: a plum edge, the
   photo drained of colour, the error verbatim, and an explicit statement that
   the shown state is stale. The error is clamped here and whole in Details. */
function brokenRow(w) {
  const known = w.last_state && w.last_state !== 'unknown';
  const stale = known
    ? `the ${esc((WORD[w.last_state] || w.last_state)).toLowerCase()} reading you see is ` +
      esc(ago(w.last_checked_at).replace(' ago', '')) + ' old'
    : 'this watch has never returned a reading';
  const n = w.consecutive_failures || 0;
  return `<div class="row broken">
    ${shot(w, 'sm')}
    <div class="row-text">
      <div class="states">
        ${eyebrowFor('failing', 'stale state')}
        ${isArmed(w) ? armedBadge() : ''}
        ${w.paused ? eyebrowFor('paused', 'after ' + n + ' failures') : ''}
      </div>
      ${w.brand ? `<span class="kicker">${esc(w.brand)}</span>` : ''}
      <span class="name">${esc(w.last_title || w.name)}</span>
      <div class="err" title="${esc(w.last_error || 'unknown error')}">${esc(w.last_error || 'unknown error')}</div>
      <span class="meta num">${n} failure${n === 1 ? '' : 's'} · ${stale}</span>
      <div class="actions">
        <button class="btn-quiet" onclick="edit(${w.id})">Fix URL</button>
        <button class="btn-quiet" onclick="checkNow(${w.id},this)">Check now</button>
        <button class="btn-quiet"
          onclick="togglePause(${w.id},${w.paused ? 1 : 0})">${w.paused ? 'Resume' : 'Pause'}</button>
        <button class="btn-text" onclick="detail(${w.id})">Details</button>
      </div>
    </div>
  </div>`;
}

function waitRow(w) {
  const st = derive(w);
  const armed = isArmed(w);
  /* Never been on sale as far as we have seen: "Not yet on sale", not
     "Sold out". */
  const key = st === 'out_of_stock' && w.ever_buyable === false ? 'not_yet' : st;

  let tracked = '';
  if (w.kind === 'collection' && w.baseline_json) {
    try {
      /* The baseline is a union and never shrinks, so a product the store has
         retired stays counted. Showing the live figure next to it is the
         difference between "717 on sale" and "717 remembered, 690 on sale". */
      const known = JSON.parse(w.baseline_json).length;
      const live = w.last_seen_count;
      tracked = ' · ' + known.toLocaleString() + ' tracked'
              + (live != null && live !== known ? ` · ${live.toLocaleString()} in the feed now` : '');
    } catch (e) {}
  }
  const status = isBackingOff(w)
    ? `<span class="s" style="color:var(--armed)" title="${esc(w.last_error)}">${GLYPH.backoff}<span>Backing off</span></span>`
    : armed
    ? `<span class="s" style="color:var(--armed)">${armedGlyph()}<span>Armed${esc(tracked)}</span></span>`
    : `<span class="s" style="color:${INK[key]}">${GLYPH[key] || ''}<span>${esc(WORD[key] || st)}${esc(tracked)}</span></span>`;
  const size = w.size_pref
    ? `<span class="sz"> · size ${esc(w.size_pref.toUpperCase())}</span>` : '';
  return `<div class="wait">
    <span class="n"><span class="k">${esc(w.brand || '')}</span>${esc(shortName(w))}${size}</span>
    ${status}
    <span class="p">${w.last_price != null ? money(w.last_price, w.currency) : '—'}</span>
    <span class="t">${esc(ago(w.last_checked_at))} · ${esc(every(w))}</span>
    <span class="wa">
      <button class="btn-text" onclick="edit(${w.id})">Edit</button>
      <button class="x edge" title="Delete this watch" aria-label="Delete ${esc(w.name)}"
        onclick="removeWatch(${w.id})">${ICON.x}</button>
    </span>
  </div>`;
}

/* ---------- drops ---------- */

const DROP_WINDOW_MS = 48 * 3600 * 1000;

/* Dismissal deletes the event, rather than flagging it in localStorage.
   This dashboard gets read on a phone and on a laptop, and an alert cleared on
   one has to be gone on the other — a per-browser flag quietly fails that. */
async function dismiss(id) {
  try { await api('/events/' + id, {method: 'DELETE'}); }
  catch (e) { toast(e.message, 'bad'); return; }
  EVENTS = EVENTS.filter(x => x.id !== id);
  render();
}

async function dismissAll(ids) {
  await Promise.all(ids.map(id => api('/events/' + id, {method: 'DELETE'}).catch(() => {})));
  EVENTS = EVENTS.filter(x => !ids.includes(x.id));
  render();
}

/* Clears EVERY event, including the ones listed above as actionable — so the
   count in the prompt has to be the total, not the length of the section the
   button happens to sit in. */
async function clearFeed() {
  if (!confirm(`Clear all ${EVENTS.length} alerts, including anything listed `
             + `above? The watches keep running.`)) return;
  try { await api('/events', {method: 'DELETE'}); }
  catch (e) { toast(e.message, 'bad'); return; }
  EVENTS = [];
  render();
  toast('Alert history cleared.', 'good');
}

const when = ts => asDate(ts);
const evName = e => e.watch_brand || e.watch_name || 'a watch';

/* Whether an event is news or merchandise is a property of the WATCH, not of
   the stored payload. Trusting the payload flag alone mislabels every event
   written before that flag existed — which is how articles ended up announcing
   themselves as "not in the 23-product catalogue". */
const isAnnounce = e =>
  e.watch_strategy === 'announce' || !!(e.payload || {}).is_announcement;

/* Events stored before per-item links existed still know their handle, and the
   handle is all a Shopify product URL needs — so old drops become clickable
   too rather than staying dead. */
function itemsOf(e) {
  const p = e.payload || {};
  let base = '';
  try { base = new URL(e.watch_url).origin; } catch (err) {}
  return (p.handles || []).map(h => {
    const it = (p.items || {})[h] || {};
    const url = it.url || (p.links || {})[h] ||
                (base && !isAnnounce(e) ? base + '/products/' + h : '');
    const carts = (it.offers || []).filter(o => o.cart_url);
    return {handle: h, title: it.title || (p.titles || {})[h] || h,
            price: it.price, url, cart: carts.length === 1 ? carts[0].cart_url : '',
            /* Carried through, not recomputed: the verdict was stored with the
               event so that this page, the alert and the history agree. */
            starred: it.starred, landed: it.landed,
            image: it.image || (p.handles.length === 1 ? p.image : '') || '',
            available: it.available, available_stated: it.available_stated};
  });
}

/* How far behind the store we were when this fired. Shown only when the store
   gave us a publish time — an unknown lag has to read as unknown, never as
   zero, or the number stops being trustworthy exactly when it matters. Past
   five minutes it turns amber and gains a glyph, so the change is not colour
   alone. */
function lagNote(e) {
  const s = (e.payload || {}).listed_ago_s;
  if (typeof s !== 'number') return '';
  const t = s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + 'm'
                                        : Math.round(s / 3600) + 'h';
  const slow = s > 300;
  return `<span class="lag${slow ? ' slow' : ''}" title="Listed by the store `
       + `${t} before we detected it">${slow ? GLYPH.backoff : ''}${t} behind</span>`;
}

/* What kind of arrival this was, in the words the storefront would use. A
   relist is not a release, and a listing you cannot buy yet is "coming
   soon" — the one word a shopper already knows. */
function arrivalTag(it, e) {
  const p = e.payload || {};
  if (it.available === false && it.available_stated)
    return '<span class="tag soon" title="Listed, nothing buyable yet">coming soon</span>';
  if (p.arrival === 'relisted') return '<span class="tag relisted">relisted</span>';
  if (p.arrival === 'unconfirmed')
    return '<span class="tag unverified" title="The store gave no listing date, so this may not be new">unverified?</span>';
  if (p.arrival === 'launched') {
    /* Listed for a while, buyable as of now. Same split as the Telegram
       alert: never seen on sale is a release, seen before is a restock. */
    if (Array.isArray(p.first_sale))
      return p.first_sale.includes(it.handle)
        ? '<span class="tag now" title="Never on sale before, as far back as this watch has looked">released</span>'
        : '<span class="tag now back" title="On sale before, sold out, and buyable again">back in stock</span>';
    return '<span class="tag now" title="Already listed; the store just made it buyable">now buyable</span>';
  }
  return '';
}

/* ---------- buckets: one per watch ---------- */

/* Collection names that say nothing on their own: the watch is the store. */
const GENERIC_NAME = /^(all|all[- ]products|shop[- ]all|frontpage|products|catalog(ue)?)?$/i;

function bucketize(rows) {
  const by = new Map();
  for (const r of rows) {
    const key = String(r.e.watch_id ?? evName(r.e));
    let b = by.get(key);
    if (!b) {
      const w = WATCHES.find(x => x.id === r.e.watch_id);
      const brand = ((w && w.brand) || r.e.watch_brand || '').trim();
      const short = (w ? shortName(w) : (r.e.watch_name || '')).trim();
      const plain = GENERIC_NAME.test(short) || short === brand;
      b = {key, announce: r.a, rows: [], newest: null, newestAt: null,
           title: plain ? (brand || short || evName(r.e)) : short,
           kicker: plain ? '' : brand,
           url: safeHref((w && w.url) || r.e.watch_url)};
      by.set(key, b);
    }
    b.rows.push(r);
    const t = when(r.e.created_at);
    if (t && (!b.newest || t > b.newest)) { b.newest = t; b.newestAt = r.e.created_at; }
  }
  const list = [...by.values()];
  for (const b of list)
    b.rows.sort((x, y) => (when(y.e.created_at) || 0) - (when(x.e.created_at) || 0));
  return list.sort((x, y) => (y.newest || 0) - (x.newest || 0));
}

/* "10 buyable items" only when all ten are. A coming-soon listing arriving in
   the same sweep is not buyable, and a count that says it is would be the
   first number on the page to lie. */
function countLine(b) {
  const n = b.rows.length, noun = n === 1 ? 'item' : 'items';
  if (b.announce) return `${n} to read`;
  const stated = b.rows.some(r => r.it.available != null);
  const buyable = b.rows.filter(r => r.it.available === true).length;
  if (!stated) return `${n} new ${noun}`;
  return buyable === n ? `${n} buyable ${noun}` : `${n} ${noun} · ${buyable} buyable`;
}

/* The whole row is the button; there is no "View" to find. */
function bucketRow(b) {
  const stars = b.rows.filter(r => r.it.starred).length;
  const photos = b.rows.map(r => r.it.image).filter(Boolean);
  const deck = b.announce ? '' : `<span class="deck">${(photos.length ? photos : [''])
    .slice(0, 3).map(src => thumb(src, 56)).join('')}</span>`;
  return `<button class="bucket${b.announce ? ' feedb' : ''}" data-key="${esc(b.key)}" onclick="openBucket(this.dataset.key)">
    ${deck}
    <span class="bk-main">
      ${b.kicker ? `<span class="k">${esc(b.kicker)}</span>` : ''}
      <span class="bk-name">${esc(b.title)}</span>
      <span class="bk-meta"><b>${esc(countLine(b))}</b> · newest ${esc(ago(b.newestAt))}</span>
    </span>
    ${stars ? `<span class="bk-star" title="Clear your gates">${ICON.star}${stars}</span>` : ''}
  </button>`;
}

/* One product inside a bucket. Links are real links, not scripted buttons:
   long-press to copy or open in a new tab works, and a URL cannot break out
   of a quoted script argument. */
function itemRow(r) {
  const {e, a} = r;
  const it = {...r.it, url: safeHref(r.it.url), cart: safeHref(r.it.cart)};
  const acts = [
    it.cart ? `<a class="chip mini btn-buy" href="${esc(it.cart)}" target="_blank" rel="noopener">Cart</a>` : '',
    it.url ? `<a class="chip mini btn-quiet" href="${esc(it.url)}" target="_blank" rel="noopener">${a ? 'Read' : 'Open'}</a>` : '',
  ].join('') || '<span class="caption">no link</span>';
  const star = it.starred
    ? `<span class="star" title="Clears your gates — worth pricing against US retail">${ICON.star}</span>` : '';
  const tag = arrivalTag(it, e);
  const price = it.price != null
    ? `<span class="price">${money(it.price, e.watch_currency)}</span>` : '';
  const landed = it.landed != null
    ? `<span class="landed">≈$${Number(it.landed).toLocaleString(undefined, {maximumFractionDigits: 0})} landed</span>` : '';
  const meta = [esc(ago(e.created_at)), lagNote(e)].filter(Boolean).join(' · ');
  const pic = thumb(it.image, 96);
  return `<div class="item">
    <div class="item-media">
      ${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${pic}</a>` : pic}
      ${tag}
    </div>
    <div class="item-main">
      <div class="item-head">${star}${it.url
        ? `<a class="item-title" href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.title)}">${esc(it.title)}</a>`
        : `<span class="item-title" title="${esc(it.title)}">${esc(it.title)}</span>`}</div>
      ${price || landed ? `<div class="pl">${price}${landed}</div>` : ''}
      <div class="item-meta">${meta}</div>
      <div class="item-acts">
        ${acts}
        <button class="x edge" title="Dismiss" aria-label="Dismiss ${esc(it.title)}"
          data-e="${e.id}" data-h="${esc(it.handle)}" onclick="dismissItem(this)">${ICON.x}</button>
      </div>
    </div>
  </div>`;
}

function openBucket(key) {
  OPEN_BUCKET = key;
  OPEN_SIG = '';
  renderBucket(true);
}

/* Redrawn only when its contents change. The page refreshes every ten
   seconds, and replacing the list under a thumb mid-scroll kills the scroll. */
function renderBucket(first) {
  const b = BUCKETS.find(x => x.key === OPEN_BUCKET);
  if (!b) { if (!first) closeSheet(); return; }
  const sig = b.rows.map(r => r.e.id + ':' + r.it.handle).join(',');
  if (!first && sig === OPEN_SIG) return;
  OPEN_SIG = sig;
  const old = $('add').querySelector('.bucket-sheet');
  const keep = old && !first ? old.scrollTop : 0;
  $('add').innerHTML = `<div class="sheet bucket-sheet" role="dialog" aria-modal="true"
      aria-label="${esc(b.title)}">
    <div class="sheet-head">
      <div class="hd">
        ${b.kicker ? `<span class="eyebrow">${esc(b.kicker)}</span>` : ''}
        <h2>${esc(b.title)}</h2>
        <p class="sub">${esc(countLine(b))} · newest ${esc(ago(b.newestAt))}</p>
      </div>
      <button class="x edge" aria-label="Close" onclick="closeSheet()">${ICON.x}</button>
    </div>
    <div class="items">${b.rows.map(itemRow).join('')}</div>
    <div class="sheet-actions">
      ${b.url ? `<a class="btn-ghost" href="${esc(b.url)}"
        target="_blank" rel="noopener">Open the store</a>` : ''}
      <button class="btn-text" style="margin-left:auto"
        onclick="clearBucket()">Clear all ${b.rows.length}</button>
    </div>
  </div>`;
  if (first) showSheet();
  const now = $('add').querySelector('.bucket-sheet');
  if (now) now.scrollTop = keep;
}

/* One product, not the whole alert it arrived in: a sweep that found three
   stores them as one event, and dismissing the event took all three. */
async function dismissItem(btn) {
  const id = Number(btn.dataset.e), handle = btn.dataset.h;
  btn.disabled = true;
  try {
    await api('/events/' + id + '/items/' + encodeURIComponent(handle), {method: 'DELETE'});
  } catch (err) {
    /* Already dismissed on another device: the goal is met, so say nothing. */
    if (!/no such/i.test(err.message)) { btn.disabled = false; toast(err.message, 'bad'); return; }
  }
  const e = EVENTS.find(x => x.id === id);
  if (e) {
    const p = e.payload || {};
    p.handles = (p.handles || []).filter(h => h !== handle);
    if (!p.handles.length) EVENTS = EVENTS.filter(x => x.id !== id);
  }
  render();
}

async function clearBucket() {
  const b = BUCKETS.find(x => x.key === OPEN_BUCKET);
  if (!b) return closeSheet();
  if (!confirm(`Clear all ${b.rows.length} from ${b.title}? The watch keeps running.`)) return;
  const ids = [...new Set(b.rows.map(r => r.e.id))];
  closeSheet();
  await dismissAll(ids);
}

/* One line per alert ever sent, so the dashboard can be checked against
   Telegram instead of only agreeing with it by coincidence. */
const FEED_WORD = {
  restock: 'Back in stock', new_product: 'New listing', held_note: 'Held — not your size',
  price_drop: 'Price drop', watch_failing: 'Watch broke', watch_recovered: 'Watch recovered',
};
function feedRow(e) {
  const p = e.payload || {};
  let note = p.title || '';
  if (e.kind === 'new_product') note = (p.handles || []).map(h => (p.titles || {})[h] || h).join(', ');
  else if (e.kind === 'price_drop') note = `${money(p.old_price, e.watch_currency)} → ${money(p.new_price, e.watch_currency)}`;
  else if (e.kind === 'watch_failing') note = p.error || '';
  const items = itemsOf(e);
  const href = (items[0] || {}).url || p.product_url || e.watch_url || '';
  const label = FEED_WORD[e.kind] || e.kind;
  const broke = e.kind === 'watch_failing';
  const full = `${label} · ${evName(e)}${note ? ' · ' + note : ''}`;
  return `<div class="feed">
    <span class="t">${esc(ago(e.created_at))}</span>
    <span class="fm" title="${esc(full)}"><span class="fs${broke ? ' bad' : ''}">${broke ? GLYPH.failing : ''}${esc(label)}</span><span class="fw"> · ${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">` : ''}${esc(evName(e))}${note ? ' · ' + esc(note) : ''}${href ? '</a>' : ''}</span></span>
    <button class="x edge" title="Delete this alert" aria-label="Delete alert" onclick="dismiss(${e.id})">${ICON.x}</button>
  </div>`;
}

/* ---------- the page ---------- */

const section = (title, n, extra, btn) =>
  `<div class="group-label"><h2>${esc(title)}</h2><span class="n">· ${n}${extra || ''}</span>${btn || ''}</div>`;

function render() {
  const act = [], held = [], broken = [], waiting = [];
  for (const w of WATCHES) {
    const st = derive(w);
    if (st === 'failing') broken.push(w);
    else if (st === 'held') held.push(w);
    else if (st === 'in_stock') act.push(w);
    else waiting.push(w);
  }

  act.sort((a, b) => (b.last_checked_at || '').localeCompare(a.last_checked_at || ''));
  broken.sort((a, b) => (b.consecutive_failures || 0) - (a.consecutive_failures || 0));

  /* A drop has no lasting stock state — the collection just carries on
     watching — so without this what it found would be invisible. */
  const cutoff = Date.now() - DROP_WINDOW_MS;
  const fired = EVENTS.filter(e => e.kind === 'new_product'
    && when(e.created_at) >= cutoff && itemsOf(e).length);

  /* News and merchandise are not the same news. A feed match is something to
     read; a drop is something to buy, and letting articles inflate "things to
     act on" is how the number stops meaning anything. */
  const buy = [], news = [];
  for (const e of fired) {
    const a = isAnnounce(e);
    for (const it of itemsOf(e)) (a ? news : buy).push({it, e, a});
  }

  const n = act.length + buy.length;
  $('headline').textContent = !WATCHES.length ? 'Nothing watched yet'
    : n === 0 ? 'Nothing to act on' : n + ' thing' + (n === 1 ? '' : 's') + ' to act on';
  $('headline').classList.toggle('quiet', n === 0);
  $('eyebrow').textContent = 'Your list · ' + new Date().toLocaleDateString(undefined,
    {weekday: 'long', day: 'numeric', month: 'long'});
  /* Only a non-zero Buyable fills, and a zero is muted, so every figure that
     stands out is something to look at. */
  const stat = (n, label, tone) =>
    `<div class="stat ${n ? tone : 'zero'}"><b>${n}${n && tone === 'bad' ? GLYPH.failing : ''}</b><span>${label}</span></div>`;
  $('counts').innerHTML = stat(act.length, 'Buyable', 'buy') + stat(buy.length, 'Dropped', '')
    + (news.length ? stat(news.length, 'To read', '') : '')
    + stat(held.length, 'Held', '') + stat(broken.length, 'Broken', 'bad');
  BUCKETS = bucketize([...buy, ...news]);
  const buyB = BUCKETS.filter(b => !b.announce), newsB = BUCKETS.filter(b => b.announce);

  const clearBtn = ids => `<button class="btn-text" onclick="dismissAll([${ids}])">Clear</button>`;

  let main = '', side = '';
  if (buy.length) {
    const ids = [...new Set(buy.map(r => r.e.id))];
    main += section('Just dropped', buy.length, '', clearBtn(ids))
      + `<div class="list">${buyB.map(bucketRow).join('')}</div>`;
  }
  if (act.length) main += section('In stock', act.length) + act.map(actRow).join('');
  if (held.length) main += section('Held', held.length) + held.map(heldRow).join('');
  if (broken.length) main += section('Failing', broken.length) + broken.map(brokenRow).join('');
  if (news.length) {
    const ids = [...new Set(news.map(r => r.e.id))];
    main += section('From your feeds', news.length, '', clearBtn(ids))
      + `<div class="list">${newsB.map(bucketRow).join('')}</div>`;
  }
  if (waiting.length) {
    side += section('Waiting', waiting.length, ' · nothing to do')
      + `<div class="list waiting">${waiting.map(waitRow).join('')}</div>`;
  }
  /* Somewhere new to watch, under the stores already watched. Hidden once
     you watch any part of a store, so the list shrinks as you use it. */
  const watchedHosts = new Set(WATCHES.map(w => hostOf(w.url)));
  const fresh = SUGGESTED.filter(x => !watchedHosts.has(hostOf(x.url)));
  if (fresh.length && WATCHES.length) {
    side += section('Stores you might watch', fresh.length)
      + `<div class="list">${fresh.map(suggRow).join('')}</div>`;
  }
  /* Anything already listed above as actionable is not repeated here. Showing
     each event twice is precisely the clutter this section was accused of. */
  const shown = new Set(fired.map(e => e.id));
  const history = EVENTS.filter(e => !shown.has(e.id));
  if (history.length) {
    side += section('Recent alerts', history.length, '',
        `<button class="btn-text" onclick="clearFeed()">Clear all</button>`)
      + `<div class="list">${history.slice(0, 25).map(feedRow).join('')}</div>`;
  }

  let html;
  if (!WATCHES.length) {
    html = `<div class="group-label"><h2>Get started</h2></div>
      <div class="empty">Nothing watched yet. Add one — a product URL for a
      restock, a store URL for new drops, or a feed URL for something not announced.
      <div><button class="btn-quiet" onclick="openAdd()">Add a watch</button></div></div>`;
  } else if (!main) {
    /* Nothing to act on: one column, so Waiting sits right under the header. */
    html = `<div class="one-col">${side}</div>`;
  } else {
    html = `<div class="cols"><div class="col-main">${main}</div>`
         + `<aside class="col-side">${side}</aside></div>`;
  }
  $('sheet').innerHTML = html;
  stickSide();
  if (OPEN_BUCKET !== null && $('add').querySelector('.bucket-sheet')
      && !$('add').classList.contains('hide')) renderBucket(false);
}

function stickSide() {
  const s = document.querySelector('.col-side');
  if (s) s.classList.toggle('stick', s.offsetHeight < window.innerHeight);
}
window.addEventListener('resize', stickSide);

/* ---------- suggestions ---------- */

const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };

function suggRow(x) {
  const carried = (x.brands || []).map(b => `<b>${esc(b.name)}</b> ${esc(b.count)}`).join(' · ');
  return `<div class="sugg">
    <span class="sn"><span class="k">${esc(x.city)}</span>${esc(x.name)}</span>
    <span class="sb">${carried ? carried + ' in stock now' : esc(x.note || '')}</span>
    <span class="sa">
      ${x.sale_url ? `<button class="chip mini btn-quiet" data-url="${esc(x.sale_url)}" data-v="${esc(JSON.stringify(x.vendors || []))}"
        onclick="watchSuggested(this.dataset.url, JSON.parse(this.dataset.v))">Watch sale</button>` : ''}
      <button class="chip mini btn-quiet" data-url="${esc(x.url)}" data-v="${esc(JSON.stringify(x.vendors || []))}"
        onclick="watchSuggested(this.dataset.url, JSON.parse(this.dataset.v))">Watch new</button>
    </span>
  </div>`;
}

/* The ordinary Add sheet, filled in: the store is identified on the spot and
   nothing is watched until you press Start watching. */
function watchSuggested(url, vendors) {
  openAdd();
  pickIntent('drop');
  $('aUrl').value = url;
  /* Only your brands. A whole multi-brand store announces every arrival,
     which is the noise this app exists to avoid. */
  if (vendors && vendors.length) {
    PENDING_FILTER = {vendors};
    $('detect').insertAdjacentHTML('afterend', `<div class="warn" id="aVendors">Only alerts
      for <b>${vendors.map(esc).join('</b>, <b>')}</b> — the store's own spelling. Change it
      later with <span class="mono">/filter</span> in Telegram.</div>`);
  }
  detect();
}

/* ---------- actions ---------- */

async function refresh() {
  try {
    /* The alert feed is not optional decoration — it is the only place a fired
       drop lives, since the watch itself goes straight back to watching. */
    const [w, e] = await Promise.all([api('/watches'), api('/events?limit=200')]);
    WATCHES = w.watches;
    EVENTS = e.events || [];
    render();
  } catch (err) { /* 401 already handled */ }
}

async function alsoAlert(id, size) {
  const w = WATCHES.find(x => x.id === id);
  const next = [(w && w.size_pref) || '', size].filter(Boolean).join(', ');
  await api('/watches/' + id, {method: 'PATCH', body: JSON.stringify({size_pref: next})});
  toast('Now also alerting on ' + size + '.', 'good');
  refresh();
}
const togglePause = (id, paused) => api('/watches/' + id, {method: 'PATCH',
  body: JSON.stringify({enabled: !!paused})}).then(refresh);

async function checkNow(id, btn) {
  const label = btn.textContent;
  btn.textContent = 'Checking…'; btn.disabled = true;
  try {
    const r = await api('/watches/' + id + '/check', {method: 'POST'});
    const st = derive(r.watch);
    toast(st === 'failing' ? 'Still failing: ' + r.watch.last_error : 'Now: ' + WORD[st],
          st === 'failing' ? 'bad' : 'good');
    refresh();
  } catch (e) { toast(e.message, 'bad'); }
  finally { btn.textContent = label; btn.disabled = false; }
}

async function detail(id) {
  OPEN_BUCKET = null;
  const d = await api('/watches/' + id);
  const w = d.watch, st = derive(w);
  $('add').innerHTML = `<div class="sheet">
    <h2>${esc(w.last_title || w.name)}</h2>
    <p class="sub mono"><a href="${esc(w.url)}" target="_blank" rel="noopener" style="color:var(--text-dim)">${esc(w.url)}</a></p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:24px">
      <div>${eyebrowFor(st, 'every ' + every(w))}</div>
      ${w.size_pref ? `<div class="meta">Watching size <b>${esc(w.size_pref.toUpperCase())}</b></div>` : ''}
      ${w.last_error ? `<div class="mono" style="font-size:13px;color:var(--failing);overflow-wrap:anywhere">${esc(w.last_error)}</div>` : ''}
    </div>
    <div class="group-label"><h2>Last ${d.checks.length} checks</h2></div>
    <div class="list">
      ${d.checks.map(c => `<div class="check">
        <span class="ct">${esc(ago(c.checked_at))}</span>
        <span class="cr" style="color:${c.ok ? 'var(--in-stock)' : 'var(--failing)'}">${c.ok ? GLYPH.in_stock + 'ok' : GLYPH.failing + 'fail'}</span>
        <span class="cs">${c.http_status == null ? '—' : c.http_status}</span>
        <span class="ce" title="${esc(c.error || c.state || '')}">${esc(c.error || c.state || '')}</span>
      </div>`).join('') || '<div class="empty">No checks yet.</div>'}
    </div>
    <div class="sheet-actions"><button class="btn-quiet" onclick="closeSheet()">Close</button></div>
  </div>`;
  showSheet();
}

async function edit(id) {
  OPEN_BUCKET = null;
  const w = (await api('/watches/' + id)).watch;
  const feedWatch = w.strategy === 'announce';
  const tier = w.base_interval_s <= 45 ? 'fast' : w.base_interval_s >= 900 ? 'slow' : 'base';

  $('add').innerHTML = `<div class="sheet">
    <h2>Edit watch</h2>
    <p class="sub">${esc(w.brand || '')} · ${esc(w.last_title || w.name)}</p>

    <div class="field">
      <label>Name</label>
      <input type="text" id="eName" value="${esc(w.name)}">
    </div>

    <div class="field">
      <label>URL <span class="hint">${esc(w.strategy)} · ${esc(w.kind)}</span></label>
      <input type="url" id="eUrl" value="${esc(w.url)}">
    </div>

    ${feedWatch ? `<div class="field">
      <label>Keywords <span class="hint">a, b = either · a + b = both</span></label>
      <input type="text" id="eKw" value="${esc(w.target_ref || '')}">
      <div class="warn note">On a busy feed, prefer <b>+</b>. One broad term matches
        nearly everything and the alerts become noise you learn to ignore.</div>
    </div>` : `<div class="field">
      <label>Size preference <span class="hint">blank = any size</span></label>
      <input type="text" id="eSize" value="${esc(w.size_pref || '')}" placeholder="m, l">
      <div class="warn note">Naming a size silences every other size — the list will
        label it <b>held, not your size</b> rather than going quiet unexplained.</div>
    </div>`}

    <div class="field">
      <label>How often</label>
      <div class="seg" id="eSeg">
        <button aria-pressed="${tier === 'fast'}" data-tier="fast">45s</button>
        <button aria-pressed="${tier === 'base'}" data-tier="base">5m</button>
        <button aria-pressed="${tier === 'slow'}" data-tier="slow">15m</button>
      </div>
    </div>

    <div id="eWarn"></div>

    <div class="sheet-actions">
      <button class="btn-quiet strong" id="eSave" onclick="saveEdit(${id})">Save changes</button>
      <button class="btn-text" onclick="closeSheet()">Cancel</button>
      <button class="btn-text"
        onclick="togglePause(${id},${w.paused ? 1 : 0}).then(closeSheet)">
        ${w.paused ? 'Resume watching' : 'Pause watching'}</button>
      <button class="btn-text danger" style="margin-left:auto"
        onclick="removeWatch(${id})">Delete</button>
      <span id="eErr" class="err-line"></span>
    </div>
  </div>`;
  showSheet();

  /* Say up front that a URL or keyword change starts over — otherwise the
     watch silently goes quiet for a cycle and looks broken. */
  const original = {url: w.url, kw: w.target_ref || ''};
  const flag = () => {
    const changed = $('eUrl').value.trim() !== original.url
      || (feedWatch && $('eKw').value.trim() !== original.kw);
    $('eWarn').innerHTML = changed
      ? `<div class="warn">This changes what the watch is looking at, so it
         starts over: the baseline is cleared and the next check re-reads from
         scratch. You won't be alerted about anything already there.</div>` : '';
  };
  $('eUrl').addEventListener('input', flag);
  if (feedWatch) $('eKw').addEventListener('input', flag);
  [...$('eSeg').children].forEach(b => b.onclick = () =>
    [...$('eSeg').children].forEach(x => x.setAttribute('aria-pressed', x === b)));
}

async function saveEdit(id) {
  const seg = [...$('eSeg').children].find(b => b.getAttribute('aria-pressed') === 'true');
  const body = {
    name: $('eName').value.trim(),
    url: $('eUrl').value.trim(),
    tier: seg ? seg.dataset.tier : 'base',
  };
  if ($('eKw')) body.target_ref = $('eKw').value.trim();
  if ($('eSize')) body.size_pref = $('eSize').value.trim() || null;

  $('eSave').disabled = true;
  try {
    const out = await api('/watches/' + id, {method: 'PATCH', body: JSON.stringify(body)});
    closeSheet();
    toast(out.rebaselined ? 'Saved. Baseline cleared — re-reading from scratch.'
                          : 'Saved.', 'good');
    refresh();
  } catch (e) { $('eErr').textContent = e.message; }
  finally { $('eSave').disabled = false; }
}

async function removeWatch(id) {
  const w = WATCHES.find(x => x.id === id);
  if (!confirm(`Delete "${(w && (w.last_title || w.name)) || id}"? Its history goes too.`)) return;
  await api('/watches/' + id, {method: 'DELETE'});
  closeSheet();
  toast('Deleted.', 'good');
  refresh();
}

/* ---------- add a watch: three intents, then only the fields that intent uses ---------- */

const INTENTS = [
  {id: 'restock', q: 'Tell me when one item is buyable again.',

  {id: 'drop', q: 'Tell me when a brand releases anything new.',
   ex: 'Satisfy quietly adding a short to its store at 4am.',
   ph: 'https://store.com/collections/all'},
  {id: 'announcement', q: 'Tell me when something unannounced becomes real.',
   ex: 'The first mention of "zelda switch 2" on a news feed.',
   ph: 'https://site.com/news.xml'},
];
