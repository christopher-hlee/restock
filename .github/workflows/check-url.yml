# Where does a link go, and can Restock watch what is there? Run by hand with
# one URL. A runner can reach share links and storefronts; the development
# container cannot.
name: check-url

on:
  workflow_dispatch:
    inputs:
      url:
        description: "The link to follow and check"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The app's own dependencies, so the script can also run the real
      # resolve → detect → check path, not only its own approximation.
      - run: pip install -q -r monitor/requirements.txt
      # Through the environment, never pasted into the command: an input is
      # text someone typed, and ${{ }} in a run line would execute it.
      - env:
          URL: ${{ inputs.url }}
        run: python3 check-url.py "$URL"
