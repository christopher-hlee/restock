# Checks candidate stores from a runner that can reach them: is the catalogue
# open to this app, and which of your brands does it carry? Run by hand; the
# results decide what the dashboard suggests.
name: suggestions

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: "Space-separated hosts to check (blank = every candidate)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Through the environment, never pasted into the command: an input is
      # text someone typed, and ${{ }} in a run line would execute it. Left
      # unquoted on purpose, so the space-separated hosts split into words.
      - env:
          HOSTS: ${{ inputs.hosts }}
        run: python3 check-suggestions.py $HOSTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suggestions-checked
          path: suggestions-checked.json
          if-no-files-found: ignore
